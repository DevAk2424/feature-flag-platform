# Enterprise v2 - full streaming stack.
# Control plane publishes flag-config-events to Kafka; the gateway consumes
# them and streams config to clients over SSE; the AI service consumes
# flag-metrics and emits flag-commands (only after human approval).
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_DB: flags, POSTGRES_USER: flags, POSTGRES_PASSWORD: flags }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  kafka:
    image: apache/kafka:3.7.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  redis:
    image: redis:7
    ports: ["6379:6379"]
  control-plane:
    build: { context: .., dockerfile: control-plane-service/Dockerfile }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/flags
      DB_USER: flags
      DB_PASSWORD: flags
      KAFKA_BOOTSTRAP: kafka:9092
    ports: ["8080:8080"]
    depends_on: [postgres, kafka]
  streaming-gateway:
    build: { context: .., dockerfile: streaming-gateway-service/Dockerfile }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BOOTSTRAP: kafka:9092
    ports: ["8081:8081"]
    depends_on: [kafka, control-plane]
  ai-risk-service:
    build: { context: ../ai-risk-service }
    environment:
      CONTROL_PLANE_URL: http://control-plane:8080
      KAFKA_BOOTSTRAP: kafka:9092
      COMMAND_TRANSPORT: http
    ports: ["8090:8090"]
    depends_on: [control-plane, kafka]
  frontend:
    build: { context: ../frontend }
    ports: ["5173:80"]
    depends_on: [streaming-gateway]
volumes: { pgdata: {} }
