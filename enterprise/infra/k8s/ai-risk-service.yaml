apiVersion: apps/v1
kind: Deployment
metadata: { name: ai-risk-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: ai-risk-service } }
  template:
    metadata: { labels: { app: ai-risk-service } }
    spec:
      containers:
        - name: ai-risk-service
          image: flag-platform/ai-risk-service:2.0.0
          ports: [{ containerPort: 8090 }]
          env:
            - { name: CONTROL_PLANE_URL, value: http://control-plane:8080 }
            - { name: KAFKA_BOOTSTRAP, value: kafka:9092 }
          readinessProbe: { httpGet: { path: /health, port: 8090 } }
---
apiVersion: v1
kind: Service
metadata: { name: ai-risk-service }
spec: { selector: { app: ai-risk-service }, ports: [{ port: 8090, targetPort: 8090 }] }
