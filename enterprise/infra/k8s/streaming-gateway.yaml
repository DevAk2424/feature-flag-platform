apiVersion: apps/v1
kind: Deployment
metadata: { name: streaming-gateway }
spec:
  replicas: 3
  selector: { matchLabels: { app: streaming-gateway } }
  template:
    metadata: { labels: { app: streaming-gateway } }
    spec:
      containers:
        - name: streaming-gateway
          image: flag-platform/streaming-gateway-service:2.0.0
          ports: [{ containerPort: 8081 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: prod }
            - { name: KAFKA_BOOTSTRAP, value: kafka:9092 }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8081 } }
---
apiVersion: v1
kind: Service
metadata: { name: streaming-gateway }
spec: { selector: { app: streaming-gateway }, ports: [{ port: 8081, targetPort: 8081 }] }
