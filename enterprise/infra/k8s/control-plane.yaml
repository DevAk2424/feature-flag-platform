apiVersion: apps/v1
kind: Deployment
metadata: { name: control-plane }
spec:
  replicas: 2
  selector: { matchLabels: { app: control-plane } }
  template:
    metadata: { labels: { app: control-plane } }
    spec:
      containers:
        - name: control-plane
          image: flag-platform/control-plane-service:2.0.0
          ports: [{ containerPort: 8080 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: prod }
            - { name: KAFKA_BOOTSTRAP, value: kafka:9092 }
            - { name: DATABASE_URL, value: jdbc:postgresql://postgres:5432/flags }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8080 } }
---
apiVersion: v1
kind: Service
metadata: { name: control-plane }
spec: { selector: { app: control-plane }, ports: [{ port: 8080, targetPort: 8080 }] }
